<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Image Catalog</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;

            color: #222;
            background: #fff;
        }

        h1 {
            margin-bottom: 30px;
        }

        .item {
            display: grid;

            grid-template-columns:
                250px
                1fr;

            gap: 30px;

            padding: 25px 0;

            border-bottom:
                1px solid #ddd;
        }

        .preview {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 250px;
            height: 180px;

            background: #f5f5f5;

            border-radius: 8px;

            overflow: hidden;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;
        }

        .info h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 4px;

            color: #666;
        }

        .copy-row {
            display: flex;

            gap: 8px;
        }

        input {
            flex: 1;

            min-width: 0;

            padding: 8px 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-family: monospace;

            font-size: 13px;
        }

        button {
            padding: 8px 14px;

            border: none;

            border-radius: 5px;

            background: #222;

            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .status {
            position: fixed;

            bottom: 20px;
            left: 50%;

            transform:
                translateX(-50%);

            padding: 10px 20px;

            background: #222;

            color: white;

            border-radius: 5px;

            opacity: 0;

            transition:
                opacity 0.2s;
        }

        .status.show {
            opacity: 1;
        }

        .error {
            padding: 20px;

            background: #ffecec;

            color: #a00;

            border-radius: 5px;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .item {
                grid-template-columns: 1fr;
            }

            .preview {
                width: 100%;
                height: 250px;
            }

        }

    </style>

</head>


<body>

<h1>Deep Learning — Images</h1>

<a href="..">Назад</a>

<div id="catalog">
    Загрузка...
</div>

<div id="status"
     class="status">

    Скопировано

</div>


<script>

async function loadCatalog() {

    const catalog =
        document.getElementById("catalog");

    try {

        const response =
            await fetch("images.json");

        if (!response.ok) {

            throw new Error(
                "Не удалось загрузить images.json"
            );

        }

        const images =
            await response.json();

        catalog.innerHTML = "";

        images.forEach(image => {

            const url =
                new URL(
                    image.file,
                    window.location.href
                ).href;

            const markdown =
                `![${image.name}](${url})`;

            const html =
                `<img src="${url}" alt="${image.name}">`;


            const item =
                document.createElement("div");

            item.className =
                "item";


            item.innerHTML = `

                <div class="preview">

                    <img
                        src="${image.file}"
                        alt="${image.name}"
                    >

                </div>


                <div class="info">

                    <h2>
                        ${image.name}
                    </h2>


                    <div class="field">

                        <label>
                            Прямая ссылка
                        </label>

                        <div class="copy-row">

                            <input
                                type="text"
                                value="${url}"
                                readonly
                            >

                            <button
                                onclick="copyText('${escapeQuotes(url)}')"
                            >
                                Копировать
                            </button>

                        </div>

                    </div>


                    <div class="field">

                        <label>
                            Markdown
                        </label>

                        <div class="copy-row">

                            <input
                                type="text"
                                value="${escapeQuotes(markdown)}"
                                readonly
                            >

                            <button
                                onclick="copyText('${escapeQuotes(markdown)}')"
                            >
                                Копировать
                            </button>

                        </div>

                    </div>


                    <div class="field">

                        <label>
                            HTML
                        </label>

                        <div class="copy-row">

                            <input
                                type="text"
                                value="${escapeQuotes(html)}"
                                readonly
                            >

                            <button
                                onclick="copyText('${escapeQuotes(html)}')"
                            >
                                Копировать
                            </button>

                        </div>

                    </div>

                </div>

            `;


            catalog.appendChild(item);

        });


    } catch (error) {

        catalog.innerHTML = `

            <div class="error">

                Ошибка загрузки каталога:

                <br><br>

                ${error.message}

            </div>

        `;

        console.error(error);

    }

}


function escapeQuotes(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");

}


async function copyText(text) {

    try {

        await navigator.clipboard
            .writeText(text);

        showStatus();

    } catch (error) {

        console.error(
            "Не удалось скопировать:",
            error
        );

    }

}


function showStatus() {

    const status =
        document.getElementById("status");

    status.classList.add("show");

    setTimeout(() => {

        status.classList.remove("show");

    }, 1500);

}


loadCatalog();

</script>


</body>

</html>
